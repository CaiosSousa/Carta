<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Para Lua da minha vida</title>
<style>
:root{
  --bg1:#f7e8e3;
  --bg2:#efe4ff;
  --bg3:#e7f3f1;
  --envelope1:#f2c6b4;
  --envelope2:#d9a08f;
  --flap1:#f7d8cb;
  --flap2:#e4b4a4;
  --text:#5b3f3f;
  --shadow:rgba(90,60,70,.18);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  color:var(--text);
}
.page{width:min(980px,100%);text-align:center}
.title{
  margin:0 0 22px;
  font-size:clamp(2rem,5vw,3.6rem);
  font-family:"Trebuchet MS","Segoe UI",sans-serif;
  font-weight:700;
  letter-spacing:.5px;
  color:#6b4d57;
}
.subtitle{margin:0 0 28px;color:#7e6975;font-size:1rem}
.scene{display:flex;justify-content:center;align-items:center;margin-bottom:26px}
.envelopeWrap{width:min(760px,100%);aspect-ratio:1.6/1;position:relative;perspective:1200px}
.envelope{
  position:absolute;inset:0;
  border-radius:28px;
  background:linear-gradient(145deg,var(--envelope1),var(--envelope2));
  box-shadow:0 25px 60px var(--shadow);
  overflow:hidden;
}
.envelope::before,.envelope::after{
  content:"";position:absolute;inset:0;
}
.envelope::before{
  background:
    linear-gradient(135deg,transparent 49.5%,rgba(255,255,255,.25) 50%,transparent 50.5%),
    linear-gradient(225deg,transparent 49.5%,rgba(0,0,0,.08) 50%,transparent 50.5%);
  opacity:.9;
}
.flap{
  position:absolute;left:0;right:0;top:0;height:54%;
  background:linear-gradient(180deg,var(--flap1),var(--flap2));
  clip-path:polygon(0 0,100% 0,50% 72%);
  transform-origin:top center;
  transition:transform .9s cubic-bezier(.2,.8,.2,1);
  z-index:3;
  box-shadow:0 10px 20px rgba(0,0,0,.12);
}
.seal{
  position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);
  width:84px;height:84px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffd9de,#ff9eb1 55%,#e36f84 100%);
  border:6px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:2rem;font-weight:700;
  box-shadow:0 12px 25px rgba(0,0,0,.14);
  z-index:4;
}
.flap.open{transform:rotateX(180deg)}
.envelope.open .seal{animation:pop .9s ease forwards}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(1)}
  35%{transform:translate(-50%,-50%) scale(1.12)}
  100%{transform:translate(-50%,-50%) scale(.88);opacity:.75}
}
.envelopeBase{
  position:absolute;inset:0;
  background:linear-gradient(145deg,var(--envelope1),var(--envelope2));
  clip-path:polygon(0 100%,50% 48%,100% 100%,100% 0,0 0);
  z-index:2;
}
.frontLines{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(135deg,transparent 49.3%,rgba(0,0,0,.08) 49.7%,transparent 50.2%),
    linear-gradient(225deg,transparent 49.3%,rgba(0,0,0,.08) 49.7%,transparent 50.2%);
}
.envelopeText{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  z-index:5;
  width:90%;
  font-family:"Georgia","Times New Roman",serif;
  font-size:clamp(1.2rem,2.7vw,2.1rem);
  color:#6a4a55;
  text-shadow:0 1px 0 rgba(255,255,255,.45);
  letter-spacing:.3px;
}
.actions{display:flex;justify-content:center}
button{
  border:0;
  border-radius:999px;
  padding:14px 28px;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#c97f90,#8d6bb3);
  box-shadow:0 12px 26px rgba(109,82,123,.22);
  transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;
}
button:hover{transform:translateY(-1px);box-shadow:0 16px 30px rgba(109,82,123,.26)}
button:active{transform:translateY(0)}
button[disabled]{opacity:.7;cursor:default}
.hint{margin-top:14px;color:#7e6975;font-size:.95rem}
@media (max-width:640px){
  .title{font-size:2rem}
  .envelopeWrap{width:min(100%,560px)}
  .envelopeText{font-size:1.05rem}
  .seal{width:70px;height:70px;font-size:1.6rem}
}
</style>
</head>
<body>
  <main class="page">
    <h1 class="title">Para Lua da minha vida</h1>


    <div class="scene">
      <div class="envelopeWrap" id="wrap">
        <div class="envelope" id="envelope">
          <div class="envelopeText"></div>
          <div class="seal">❤</div>
          <div class="flap" id="flap"></div>
          <div class="envelopeBase"></div>
          <div class="frontLines"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="openBtn" onclick="openEnvelope()">Abra</button>
    </div>
  </main>

<script>
function openEnvelope(){
  const envelope = document.getElementById('envelope');
  const flap = document.getElementById('flap');
  const btn = document.getElementById('openBtn');
  btn.disabled = true;
  envelope.classList.add('open');
  flap.classList.add('open');
  setTimeout(() => {
    window.location.href = 'projeto.html';
  }, 1100);
}
</script>
</body>
</html>
